<body class="journal-page">

<div class="journal-layout">

    <aside class="archive-sidebar">

        <h2> Archive</h2>

        <button id="newEntryBtn">➕ New Entry</button>

        <div id="archiveList">

            <!-- Entries will appear here -->

        </div>

    </aside>

    <main class="journal-main">

        <h1>Ze journal</h1>

        <p>
            This is where we can write our entries!
        </p>

        <textarea
            id="journal"
            placeholder="Dear Luvveh,

Today..."></textarea>

        <br>

        <button onclick="saveJournal()">💾 Save Entry</button>
        <button onclick="resetJournal()">🗑️ Clear Journal</button>

    </main>

</div>
