<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journal!</title>

    <link rel="stylesheet" href="style.css">
</head>
	
<body class="journal-page">

<div class="journal-layout">

    <aside class="archive-sidebar">

        <h2> Archive</h2>

        <button id="newEntryBtn">➕ New Entry</button>

        <div id="archiveList">

            <!-- Entries will appear here -->

        </div>

    </aside>

    <main class="journal-main">

        <h1>Ze journal</h1>

        <p>
            This is where we can write our entries!
        </p>

        <textarea
            id="journal"
            placeholder="Dear Luvveh,

Today..."></textarea>

        <br>

        <button onclick="saveJournal()">💾 Save Entry</button>

    </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Script_Journal.js"></script>

</body>
</html>
