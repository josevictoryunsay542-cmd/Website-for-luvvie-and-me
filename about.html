<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journal!</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="journal-page">

<h1>Ze Journal</h1>

<textarea id="journal" placeholder="Write your thoughts..."></textarea>
<br><br>

<button onclick="saveJournal()">💾 Save Entry</button>

<hr>

<div class="journal-container">

    <div id="archive" class="archive">
        <h2>Archive</h2>
    </div>

    <div id="viewer" class="viewer">
        <h2>Select an entry</h2>
        <p>Click an entry from the archive.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Script_Journal.js"></script>

</body>
</html>
