<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Date Planner</title>

    <link rel="stylesheet" href="planner.css">
</head>

<body class="planner-page">
    <button class="menu-button" onclick="openSidebar()">☰</button>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

<aside id="sidebar" class="sidebar">

    <button class="close-sidebar" onclick="closeSidebar()">×</button>

    <h2>Our Little Corner</h2>

    <nav>
        <a href="index.html"> Home</a>
        <a href="Journal.html"> Journal</a>
        <a href="questions.html"> Questions</a>
        <a href="planner.html"> Date Planner</a>

    </nav>

</aside>

    <div class="planner-container">

        <header class="planner-header">

            <h1>Our Date Planner</h1>

            <p>
                A little place to plan the things we want to do together.
            </p>

        </header>


        <main class="planner-content">

            <!-- CALENDAR -->

            <section class="calendar-section">

                <div class="calendar-top">

                    <button id="prevMonth">
                        ◀
                    </button>

                    <h2 id="monthYear">
                        Loading...
                    </h2>

                    <button id="nextMonth">
                        ▶
                    </button>

                </div>


                <div class="calendar-weekdays">

                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>

                </div>


                <div id="calendar" class="calendar">

                    <!-- Calendar generated by JavaScript -->

                </div>

            </section>


            <!-- EVENT PANEL -->

            <aside class="planner-sidebar">

                <h2>📖 Date Details</h2>

                <p id="selectedDate">
                    Select a date
                </p>


                <label for="eventTitle">
                    What are we doing?
                </label>

                <input
                    type="text"
                    id="eventTitle"
                    placeholder="Movie night, dinner, call..."
                >


                <label for="eventDescription">
                    Details
                </label>

                <textarea
                    id="eventDescription"
                    placeholder="Write some details..."
                ></textarea>


                <button id="saveEventBtn">
                    ✨ Save Date
                </button>


                <button id="clearEventBtn">
                    🗑️ Clear
                </button>


                <div class="upcoming-section">

                    <h2>Upcoming</h2>

                    <div id="upcomingEvents">

                        <p>No upcoming dates yet.</p>

                    </div>

                </div>

            </aside>

        </main>


        <footer>

            <a href="about.html">
                ← Back to Journal
            </a>

        </footer>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="planner.js"></script>

</body>

</html>
